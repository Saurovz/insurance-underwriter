[project]
name = "insurance-underwriter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saurovz", email = "sauthakur@teksystems.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pypdf>=4.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "streamlit>=1.52.1",
    "pdfplumber>=0.11.8",
    "langchain-huggingface>=1.1.0",
    "python-dotenv>=1.2.1",
    "langchain>=1.1.3",
    "langchain-core>=1.1.3",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "reportlab>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.scripts]
insurance-underwriter = "insurance_underwriter:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"
